<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>买方融资需求 · 透明化物流平台</title>
    <style>
        /* 样式同之前，略... 为了简洁，此处省略样式，您可复制之前的样式部分 */
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#07111F;color:#E2EDF8;font-family:system-ui,sans-serif;max-width:430px;margin:0 auto;padding-bottom:30px}
        .topbar{position:sticky;top:0;background:rgba(7,17,31,0.95);backdrop-filter:blur(20px);display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,0.1)}
        .logo{display:flex;align-items:baseline;gap:6px;cursor:pointer}
        .logo-mini{font-size:20px}.logo-cn{font-weight:800;font-size:15px}.logo-es{font-weight:600;font-size:9px;color:#00C2A8}
        .lang-toggle{display:flex;background:#122844;border-radius:20px;padding:3px;cursor:pointer}
        .lang-opt{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;background:rgba(245,166,35,0.2);color:#F5A623;white-space:nowrap}
        .lang-opt.on{background:#00C2A8;color:#07111F}
        .back-home{display:inline-block;margin:16px 0 8px 18px;padding:8px 16px;background:#122844;border-radius:30px;font-size:13px;color:#00C2A8;cursor:pointer;border:1px solid rgba(255,255,255,0.1);width:auto}
        .pg-title{font-weight:800;font-size:24px;margin:12px 18px}
        .btn-outline{background:transparent;border:1px solid #00C2A8;border-radius:30px;padding:10px;margin:0 18px 20px;width:calc(100% - 36px);color:#00C2A8;font-weight:600;cursor:pointer}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;z-index:1000}
        .modal-content{background:#0D1E33;max-width:340px;width:90%;border-radius:28px;padding:24px;border:1px solid #00C2A8;position:relative}
        .modal input, .modal textarea{width:100%;margin-bottom:12px;padding:10px;background:#122844;border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:white}
        .close{position:absolute;right:16px;top:12px;font-size:24px;cursor:pointer;color:#7A9AB8}
        .btn{background:#00C2A8;border:none;border-radius:30px;padding:10px;font-weight:700;color:#07111F;width:100%;cursor:pointer;margin-top:8px}
    </style>
</head>
<body>
    <div class="topbar">
        <div class="logo" onclick="window.location.href='../index.html'">
            <span class="logo-mini">🌐</span><span class="logo-cn">透明化物流平台</span><span class="logo-es">Financiamiento</span>
        </div>
        <div class="lang-toggle" onclick="toggleLang()">
            <div class="lang-opt on" id="lo-es">ES</div><div class="lang-opt" id="lo-zh">中文</div>
        </div>
    </div>
    <div class="back-home" onclick="window.location.href='../index.html'"><span id="back-home-text">← Volver al Inicio</span></div>
    <div class="pg-title" id="page-title">📢 Financiamiento para Importadores</div>
    <button class="btn-outline" onclick="openModal()">+ Publicar necesidad</button>

    <div id="modal" class="modal" onclick="if(event.target===this) closeModal()">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3 id="modal-title">Publicar necesidad</h3>
            <input type="text" id="fn-product" placeholder="Producto / 产品 *">
            <input type="number" id="fn-amount" placeholder="Monto USD *">
            <input type="number" id="fn-paid" placeholder="% ya pagado *">
            <input type="number" id="fn-term" placeholder="Plazo (días) *">
            <input type="number" id="fn-rate" placeholder="Tasa esperada (%) (opcional)">
            <input type="text" id="fn-contact" placeholder="WhatsApp / email *">
            <textarea id="fn-notes" rows="2" placeholder="Información adicional"></textarea>
            <button class="btn" onclick="submitFinancing()">📧 Enviar solicitud</button>
        </div>
    </div>

    <script>
        // 多语言
        const langData = {
            es: { 'back-home-text': '← Volver al Inicio', 'page-title': '📢 Financiamiento para Importadores', 'modal-title': 'Publicar necesidad' },
            zh: { 'back-home-text': '← 返回首页', 'page-title': '📢 进口商融资需求', 'modal-title': '发布需求' }
        };
        let currentLang = 'es';
        function toggleLang() {
            currentLang = currentLang === 'es' ? 'zh' : 'es';
            document.getElementById('lo-es').classList.toggle('on', currentLang === 'es');
            document.getElementById('lo-zh').classList.toggle('on', currentLang === 'zh');
            applyLang();
        }
        function applyLang() {
            const t = langData[currentLang];
            document.getElementById('back-home-text').innerText = t['back-home-text'];
            document.getElementById('page-title').innerText = t['page-title'];
            document.getElementById('modal-title').innerText = t['modal-title'];
        }
        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function submitFinancing() {
            const product = document.getElementById('fn-product').value.trim();
            const amount = document.getElementById('fn-amount').value;
            const paid = document.getElementById('fn-paid').value;
            const term = document.getElementById('fn-term').value;
            const rate = document.getElementById('fn-rate').value;
            const contact = document.getElementById('fn-contact').value.trim();
            const notes = document.getElementById('fn-notes').value.trim();

            if (!product || !amount || !paid || !term || !contact) {
                alert(currentLang === 'es' ? 'Complete los campos obligatorios' : '请填写所有必填字段');
                return;
            }

            // 构造邮件/WhatsApp内容
            const subject = `Nueva solicitud de financiamiento: ${product}`;
            const body = `Producto: ${product}%0AMonto: $${amount} USD%0APagado: ${paid}%%0APlazo: ${term} días%0A${rate ? `Tasa esperada: ${rate}%` : ''}%0AContacto: ${contact}%0ANotas: ${notes || 'Ninguna'}`;
            // 您可以替换为您的邮箱地址或 WhatsApp 链接
            window.location.href = `mailto:latinavance.latinavance@gmail.com?subject=${subject}&body=${body}`;
            closeModal();
            alert(currentLang === 'es' ? '✅ Solicitud enviada. Nos pondremos en contacto pronto.' : '✅ 需求已发送。我们将尽快联系您。');
        }

        window.addEventListener('load', applyLang);
    </script>
</body>
</html>
