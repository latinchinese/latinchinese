<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>核实供应商 · 透明化物流平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07111F;color:#E2EDF8;font-family:system-ui,sans-serif;max-width:430px;margin:0 auto;padding-bottom:30px}
.topbar{position:sticky;top:0;background:rgba(7,17,31,0.95);backdrop-filter:blur(20px);display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,0.1)}
.logo{display:flex;align-items:baseline;gap:6px;cursor:pointer}
.logo-mini{font-size:20px}.logo-cn{font-weight:800;font-size:15px}.logo-es{font-weight:600;font-size:9px;color:#00C2A8}
.lang-toggle{display:flex;background:#122844;border-radius:20px;padding:3px;cursor:pointer}
.lang-opt{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;background:rgba(245,166,35,0.2);color:#F5A623;white-space:nowrap}
.lang-opt.on{background:#00C2A8;color:#07111F}
.back-home{display:inline-block;margin:16px 0 8px 18px;padding:8px 16px;background:#122844;border-radius:30px;font-size:13px;color:#00C2A8;cursor:pointer;border:1px solid rgba(255,255,255,0.1);width:auto}
.card{background:#0D1E33;border-radius:16px;padding:18px;margin:18px}
.fg{margin-bottom:14px}
.fi,.fta{width:100%;background:#122844;border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:white;padding:11px 14px;outline:none}
.btn{background:#00C2A8;border:none;border-radius:12px;padding:13px;font-weight:700;color:#07111F;width:100%;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<div class="topbar">
    <div class="logo" onclick="window.location.href='index.html'">
        <span class="logo-mini">🌐</span><span class="logo-cn">透明化物流平台</span><span class="logo-es">Verificar Proveedor</span>
    </div>
    <div class="lang-toggle" onclick="toggleLang()">
        <div class="lang-opt on" id="lo-es">ES</div><div class="lang-opt" id="lo-zh">中文</div>
    </div>
</div>
<div class="back-home" onclick="window.location.href='index.html'"><span id="back-home-text">← Volver al Inicio</span></div>

<div class="card">
    <div class="fg"><label id="ins-name-label">Nombre del proveedor / 供应商名称</label><input class="fi" type="text" id="ins-name" placeholder="Ej: Shanghai XX Machinery Co."></div>
    <div class="fg"><label id="ins-url-label">Sitio web / 网站链接</label><input class="fi" type="url" id="ins-url" placeholder="https://..."></div>
    <div class="fg"><label id="ins-phone-label">Teléfono / WeChat del vendedor / 供应商电话/微信</label><input class="fi" type="text" id="ins-phone" placeholder="WeChat: xxx"></div>
    <div class="fg"><label id="ins-desc-label">Descripción del producto / 货物名称</label><textarea class="fta" id="ins-desc" rows="2" placeholder="Ej: excavadora pequeña"></textarea></div>
    <div class="fg"><label id="ins-wa-label">Tu WhatsApp / correo (para respuesta) / 您的联系方式</label><input class="fi" type="tel" id="ins-wa" placeholder="+51 999 123 456"></div>
    <button class="btn" onclick="submitInspeccion()" id="t-ins-btn">📩 Enviar solicitud de verificación</button>
    <button class="btn" onclick="aiVerify()" id="ai-verify-btn" style="background:#8B6FE8; margin-top:12px;">🤖 AI Verificar (con internet) / AI 联网核实</button>
    <div id="aiVerifyResult" style="margin-top:15px; background:#122844; padding:12px; border-radius:12px;"></div>
</div>

<script>
let lang = 'es';
const WORKER_URL = 'https://cold-cake-3008.latinagro.workers.dev'; // 您的 Worker 地址

function applyLang() {
    const t = {
        es: {
            'back-home-text': '← Volver al Inicio',
            'ins-name-label': 'Nombre del proveedor',
            'ins-url-label': 'Sitio web',
            'ins-phone-label': 'Teléfono / WeChat',
            'ins-desc-label': 'Descripción del producto',
            'ins-wa-label': 'Tu WhatsApp / correo',
            't-ins-btn': '📩 Enviar solicitud de verificación',
            'ai-verify-btn': '🤖 AI Verificar (con internet)'
        },
        zh: {
            'back-home-text': '← 返回首页',
            'ins-name-label': '供应商名称',
            'ins-url-label': '网站链接',
            'ins-phone-label': '供应商电话/微信',
            'ins-desc-label': '货物名称',
            'ins-wa-label': '您的联系方式',
            't-ins-btn': '📩 提交核实',
            'ai-verify-btn': '🤖 AI 联网核实'
        }
    };
    const text = t[lang];
    for (let [id, val] of Object.entries(text)) {
        let el = document.getElementById(id);
        if (el) el.innerText = val;
    }
}
function toggleLang() {
    lang = lang === 'es' ? 'zh' : 'es';
    document.getElementById('lo-es').classList.toggle('on', lang === 'es');
    document.getElementById('lo-zh').classList.toggle('on', lang === 'zh');
    applyLang();
}
function submitInspeccion() {
    alert(lang === 'es' ? 'Solicitud enviada (simulada)' : '已提交（模拟）');
}
async function aiVerify() {
    const name = document.getElementById('ins-name').value.trim();
    const url = document.getElementById('ins-url').value.trim();
    if (!name && !url) {
        alert(lang === 'es' ? 'Ingresa al menos el nombre o la web.' : '请至少填写名称或网址');
        return;
    }
    const prompt = `请使用联网搜索功能，核查以下中国供应商的工商状态和信用信息：\n名称：${name}\n网站：${url}\n请返回：公司状态（存续/注销）、成立时间、是否有出口资质、是否有负面记录。用西语和中文双语回答，简洁清晰。`;
    try {
        const resp = await fetch(`${WORKER_URL}/search`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: 'deepseek-chat', messages: [{ role: 'user', content: prompt }] })
        });
        const data = await resp.json();
        const result = data.choices[0].message.content;
        document.getElementById('aiVerifyResult').innerHTML = result.replace(/\n/g, '<br>');
    } catch(e) {
        document.getElementById('aiVerifyResult').innerHTML = lang === 'es' ? 'Error de conexión con AI.' : 'AI 连接错误。';
    }
}
window.addEventListener('load', () => { applyLang(); });
</script>
</body>
</html>
