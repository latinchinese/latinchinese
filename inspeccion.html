<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>核实供应商 · 透明化物流平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07111F;color:#E2EDF8;font-family:system-ui,sans-serif;max-width:430px;margin:0 auto;padding-bottom:30px}
.topbar{position:sticky;top:0;background:rgba(7,17,31,0.95);backdrop-filter:blur(20px);display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,0.1)}
.logo{display:flex;align-items:baseline;gap:6px;cursor:pointer}
.logo-mini{font-size:20px}.logo-cn{font-weight:800;font-size:15px}.logo-es{font-weight:600;font-size:9px;color:#00C2A8}
.lang-toggle{display:flex;background:#122844;border-radius:20px;padding:3px;cursor:pointer}
.lang-opt{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;background:rgba(245,166,35,0.2);color:#F5A623;white-space:nowrap}
.lang-opt.on{background:#00C2A8;color:#07111F}
.back-home{display:inline-block;margin:16px 0 8px 18px;padding:8px 16px;background:#122844;border-radius:30px;font-size:13px;color:#00C2A8;cursor:pointer;border:1px solid rgba(255,255,255,0.1);width:auto}
.card{background:#0D1E33;border-radius:16px;padding:18px;margin:18px}
.fg{margin-bottom:14px}.fl{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:#7A9AB8;margin-bottom:6px}
.fi,.fta{width:100%;background:#122844;border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:white;padding:11px 14px;outline:none}
.btn{background:#00C2A8;border:none;border-radius:12px;padding:13px;font-weight:700;color:#07111F;width:100%;cursor:pointer;margin-top:10px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#22C97A;color:#07111F;font-weight:700;font-size:13px;padding:10px 20px;border-radius:20px;z-index:999;display:none;white-space:nowrap}
</style>
</head>
<body>
<div class="topbar"><div class="logo" onclick="window.location.href='index.html'"><span class="logo-mini">🌐</span><span class="logo-cn">透明化物流平台</span><span class="logo-es">Verificar Proveedor</span></div><div class="lang-toggle" onclick="toggleLang()"><div class="lang-opt on" id="lo-es">ES</div><div class="lang-opt" id="lo-zh">中文</div></div></div>
<div class="back-home" onclick="window.location.href='index.html'"><span id="back-home-text">← Volver al Inicio</span></div>

<div class="card">
  <div class="fg"><div class="fl"><span id="ins-name-label">Nombre del proveedor / 供应商名称</span></div><input class="fi" type="text" id="ins-name" placeholder="Ej: Shanghai XX Machinery Co."></div>
  <div class="fg"><div class="fl"><span id="ins-url-label">Sitio web / 网站链接</span></div><input class="fi" type="url" id="ins-url" placeholder="https://..."></div>
  <div class="fg"><div class="fl"><span id="ins-phone-label">Teléfono / WeChat del vendedor / 供应商电话/微信</span></div><input class="fi" type="text" id="ins-phone" placeholder="WeChat: xxx"></div>
  <div class="fg"><div class="fl"><span id="ins-desc-label">Descripción del producto / 货物名称</span></div><textarea class="fta" id="ins-desc" rows="2" placeholder="Ej: excavadora pequeña"></textarea></div>
  <div class="fg"><div class="fl"><span id="ins-wa-label">Tu WhatsApp / correo (para respuesta) / 您的联系方式</span></div><input class="fi" type="tel" id="ins-wa" placeholder="+51 999 123 456"></div>
  <button class="btn" onclick="submitInspeccion()" id="t-ins-btn">📩 Enviar solicitud de verificación</button>
  <div style="font-size:12px;color:#7A9AB8;text-align:center;margin-top:12px">Te responderemos en < 48h</div>
</div>
<div class="toast" id="toast"><span id="toast-msg"></span></div>

<script>
const T = {
  es: { 
    'back-home-text':'← Volver al Inicio',
    'ins-name-label':'Nombre del proveedor',
    'ins-url-label':'Sitio web',
    'ins-phone-label':'Teléfono / WeChat',
    'ins-desc-label':'Descripción del producto',
    'ins-wa-label':'Tu WhatsApp / correo',
    't-ins-btn':'📩 Enviar solicitud de verificación'
  },
  zh: { 
    'back-home-text':'← 返回首页',
    'ins-name-label':'供应商名称',
    'ins-url-label':'网站链接',
    'ins-phone-label':'供应商电话/微信',
    'ins-desc-label':'货物名称',
    'ins-wa-label':'您的联系方式',
    't-ins-btn':'📩 提交核实'
  }
};
let currentLang = 'es';

function applyLang() {
  const t = T[currentLang];
  for (let [id, val] of Object.entries(t)) {
    let el = document.getElementById(id);
    if (el) el.innerText = val;
  }
}

function toggleLang() {
  currentLang = currentLang === 'es' ? 'zh' : 'es';
  applyLang();
  document.getElementById('lo-es').classList.toggle('on', currentLang === 'es');
  document.getElementById('lo-zh').classList.toggle('on', currentLang === 'zh');
}

function showToast(msg) {
  let t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2500);
}

function submitInspeccion() {
  const name = document.getElementById('ins-name').value.trim();
  const url = document.getElementById('ins-url').value.trim();
  const phone = document.getElementById('ins-phone').value.trim();
  const desc = document.getElementById('ins-desc').value.trim();
  const wa = document.getElementById('ins-wa').value.trim();

  if (!name || !url || !wa) {
    showToast(currentLang === 'zh' ? '请至少填写供应商名称、网址和您的联系方式' : 'Complete nombre, sitio web y su contacto');
    return;
  }

  fetch('https://formsubmit.co/ajax/latinavance.latinavance@gmail.com', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Accept': 'application/json'
    },
    body: JSON.stringify({
      name: name,
      website: url,
      phone: phone,
      product_desc: desc,
      contact: wa,
      _subject: 'Nueva solicitud de verificación de proveedor'
    })
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      showToast(currentLang === 'zh' ? '✅ 已提交，我们将在48小时内核实并回复' : '✅ Solicitud enviada, revisaremos en 48h');
      setTimeout(() => window.location.href = 'index.html', 2000);
    } else {
      showToast(currentLang === 'zh' ? '提交失败，请稍后重试' : 'Error, intente de nuevo');
      console.error('FormSubmit error:', data);
    }
  })
  .catch(error => {
    console.error('Fetch error:', error);
    showToast(currentLang === 'zh' ? '网络错误，请检查连接' : 'Error de red');
  });
}

window.addEventListener('load', () => {
  applyLang();
});
</script>
</body>
</html>
