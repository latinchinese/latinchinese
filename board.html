<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>融资需求公示板 · 透明化物流平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07111F;color:#E2EDF8;font-family:system-ui,sans-serif;max-width:430px;margin:0 auto;padding-bottom:30px}
.topbar{position:sticky;top:0;background:rgba(7,17,31,0.95);backdrop-filter:blur(20px);display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,0.1)}
.logo{display:flex;align-items:baseline;gap:6px;cursor:pointer}
.logo-mini{font-size:20px}.logo-cn{font-weight:800;font-size:15px}.logo-es{font-weight:600;font-size:9px;color:#00C2A8}
.lang-toggle{display:flex;background:#122844;border-radius:20px;padding:3px;cursor:pointer}
.lang-opt{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;background:rgba(245,166,35,0.2);color:#F5A623;white-space:nowrap}
.lang-opt.on{background:#00C2A8;color:#07111F}
.back-home{display:inline-block;margin:16px 0 8px 18px;padding:8px 16px;background:#122844;border-radius:30px;font-size:13px;color:#00C2A8;cursor:pointer;border:1px solid rgba(255,255,255,0.1);width:auto}
.pg-title{font-weight:800;font-size:24px;margin:12px 18px}
.financing-item{background:#0D1E33;border-radius:16px;padding:16px;margin:12px 18px;border-left:4px solid #F5A623}
.financing-amount{font-size:20px;font-weight:700;color:#F5A623}
.financing-term{font-size:12px;color:#7A9AB8;margin:4px 0}
.row{display:flex;flex-wrap:wrap;margin:6px 0}
.label{width:110px;font-weight:600;color:#7A9AB8;font-size:13px}
.value{flex:1;color:#E2EDF8;font-size:13px}
.contact-note{margin-top:12px;border-top:1px solid rgba(255,255,255,0.1);padding-top:8px;font-size:12px;color:#7A9AB8}
.contact-note a{color:#00C2A8;text-decoration:none}
.empty{text-align:center;padding:40px;color:#7A9AB8}
</style>
</head>
<body>
<div class="topbar"><div class="logo" onclick="window.location.href='index.html'"><span class="logo-mini">🌐</span><span class="logo-cn">透明化物流平台</span><span class="logo-es">Tablón de financiamiento</span></div><div class="lang-toggle" onclick="toggleLang()"><div class="lang-opt on" id="lo-es">ES</div><div class="lang-opt" id="lo-zh">中文</div></div></div>
<div class="back-home" onclick="window.location.href='index.html'"><span id="back-home-text">← Volver al Inicio</span></div>
<div class="pg-title" id="page-title">📢 Solicitudes de financiamiento</div>
<div id="board-container"></div>

<script>
// 静态双语内容（无需语言切换，直接显示中西文）
function maskCompany(company){
  if(!company) return '';
  if(company.length <= 4) return company[0]+'***';
  return company.slice(0, company.length-2) + '**';
}
function maskPhone(phone){
  if(!phone) return '';
  let cleaned=phone.replace(/\D/g,'');
  if(cleaned.length<=6) return phone.slice(0,2)+'***'+phone.slice(-2);
  return phone.slice(0,3)+'***'+phone.slice(-3);
}
function maskEmail(email){
  if(!email) return '';
  let parts=email.split('@');
  if(parts.length<2) return email;
  let local=parts[0];
  if(local.length<=2) return local+'***@'+parts[1];
  return local.slice(0,2)+'***@'+parts[1];
}

function renderBoard(){
  const container=document.getElementById('board-container');
  if(!container) return;
  const requests=JSON.parse(localStorage.getItem('financing_requests')||'[]');
  if(requests.length===0){
    container.innerHTML=`<div class="empty">暂无融资需求。快来发布第一条吧！<br>No hay solicitudes publicadas. ¡Sé el primero!</div>`;
    return;
  }
  container.innerHTML=requests.map(req=>{
    const financed=(req.total*req.ratio/100).toFixed(0);
    const maskedCompany=maskCompany(req.company);
    const maskedWhatsapp=maskPhone(req.whatsapp);
    const maskedEmail=maskEmail(req.email);
    const countryName = req.country || 'Perú';
    // 融资方式翻译
    let methodDisplay = req.method;
    if(req.method === 'Carta de crédito diferida') methodDisplay = '远期信用证 / Carta de crédito diferida';
    else if(req.method === 'Pago directo a proveedor') methodDisplay = '直接支付给供应商 / Pago directo a proveedor';
    else methodDisplay = req.method;
    return `
      <div class="financing-item">
        <div class="financing-amount">💰 ${req.total} USD  <span style="font-size:12px; color:#7A9AB8;">(${req.ratio}% financiamiento = ${financed} USD)</span></div>
        <div class="financing-term">⏱ ${req.term} días / 天</div>
        
        <div class="row"><div class="label">🌍 País / 国家:</div><div class="value">${countryName}</div></div>
        <div class="row"><div class="label">🏢 Empresa / 公司:</div><div class="value">${maskedCompany}</div></div>
        <div class="row"><div class="label">📦 Producto / 产品:</div><div class="value">${req.product}</div></div>
        <div class="row"><div class="label">💳 Método / 支付方式:</div><div class="value">${methodDisplay}</div></div>
        <div class="row"><div class="label">📞 Contacto / 联系方式:</div><div class="value">${maskedWhatsapp} | ${maskedEmail}</div></div>
        
        <div class="contact-note">
          📧 有关融资细节，请直接发邮件与平台联系：<a href="mailto:info@latinchinese.com">info@latinchinese.com</a><br>
          📧 Para más detalles, contacta a la plataforma: <a href="mailto:info@latinchinese.com">info@latinchinese.com</a>
        </div>
      </div>
    `;
  }).join('');
}

function toggleLang(){
  // 此页面不需要语言切换，因为已经是双语显示，但为了保留顶部按钮的视觉效果，仍做简单处理
  const esBtn=document.getElementById('lo-es');
  const zhBtn=document.getElementById('lo-zh');
  const isEs=esBtn.classList.contains('on');
  if(isEs){
    esBtn.classList.remove('on');
    zhBtn.classList.add('on');
  } else {
    esBtn.classList.add('on');
    zhBtn.classList.remove('on');
  }
  // 页面内容已经是双语，所以不需要重新渲染
}
window.addEventListener('load',()=>{renderBoard();});
</script>
</body>
</html>
