<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>融资需求公示板 · 透明化物流平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07111F;color:#E2EDF8;font-family:system-ui,sans-serif;max-width:430px;margin:0 auto;padding-bottom:30px}
.topbar{position:sticky;top:0;background:rgba(7,17,31,0.95);backdrop-filter:blur(20px);display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,0.1)}
.logo{display:flex;align-items:baseline;gap:6px;cursor:pointer}
.logo-mini{font-size:20px}.logo-cn{font-weight:800;font-size:15px}.logo-es{font-weight:600;font-size:9px;color:#00C2A8}
.lang-toggle{display:flex;background:#122844;border-radius:20px;padding:3px;cursor:pointer}
.lang-opt{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;background:rgba(245,166,35,0.2);color:#F5A623;white-space:nowrap}
.lang-opt.on{background:#00C2A8;color:#07111F}
.back-home{display:inline-block;margin:16px 0 8px 18px;padding:8px 16px;background:#122844;border-radius:30px;font-size:13px;color:#00C2A8;cursor:pointer;border:1px solid rgba(255,255,255,0.1);width:auto}
.pg-title{font-weight:800;font-size:24px;margin:12px 18px}
.financing-item{background:#0D1E33;border-radius:16px;padding:16px;margin:12px 18px;border-left:4px solid #F5A623}
.financing-amount{font-size:18px;font-weight:700;color:#F5A623;margin-bottom:4px}
.financing-term{font-size:13px;color:#7A9AB8;margin-bottom:12px}
.detail-row{display:flex;margin-bottom:8px;align-items:flex-start}
.detail-icon{width:28px;font-size:18px;color:#00C2A8;text-align:center;flex-shrink:0}
.detail-label{width:85px;font-weight:600;color:#7A9AB8;font-size:13px;flex-shrink:0}
.detail-value{flex:1;color:#E2EDF8;font-size:13px;line-height:1.4}
.purpose-text{color:#E2EDF8;font-size:13px;margin-top:2px}
.purpose-line{color:#F5A623;font-size:12px;margin-bottom:2px}
.contact-note{margin-top:12px;border-top:1px solid rgba(255,255,255,0.1);padding-top:10px;font-size:12px;color:#7A9AB8}
.contact-note a{color:#00C2A8;text-decoration:none}
.empty{text-align:center;padding:40px;color:#7A9AB8}
.phone-highlight{color:#F5A623;font-weight:700}
</style>
</head>
<body>
<div class="topbar"><div class="logo" onclick="window.location.href='index.html'"><span class="logo-mini">🌐</span><span class="logo-cn">透明化物流平台</span><span class="logo-es">Tablón de financiamiento</span></div><div class="lang-toggle" onclick="toggleLang()"><div class="lang-opt on" id="lo-es">ES</div><div class="lang-opt" id="lo-zh">中文</div></div></div>
<div class="back-home" onclick="window.location.href='index.html'"><span id="back-home-text">← Volver al Inicio</span></div>
<div class="pg-title" id="page-title">📢 Solicitudes de financiamiento</div>
<div id="board-container"></div>

<script>
// 多语言数据
const langData = {
  es: {
    'back-home-text': '← Volver al Inicio',
    'page-title': '📢 Solicitudes de financiamiento',
    'empty': 'No hay solicitudes publicadas. ¡Sé el primero!',
    'amount': '💰 Monto',
    'term': '⏱ Plazo',
    'company': '🏢 Empresa',
    'purpose_title': '🎯 Propósito',
    'purpose_prefix': 'Para comprar productos chinos:',
    'method': '💳 Método de pago',
    'contact': '📞 Contacto',
    'contact_note': '📧 Para más detalles, contacta a la plataforma:',
    'email': 'info@latinchinese.com',
    'days': 'días'
  },
  zh: {
    'back-home-text': '← 返回首页',
    'page-title': '📢 融资需求列表',
    'empty': '暂无融资需求。快来发布第一条吧！',
    'amount': '💰 融资金额',
    'term': '⏱ 融资期限',
    'company': '🏢 公司名称',
    'purpose_title': '🎯 融资目的',
    'purpose_prefix': '用于购买中国产品：',
    'method': '💳 支付方式',
    'contact': '📞 联系方式',
    'contact_note': '📧 有关融资细节，请直接发邮件与平台联系：',
    'email': 'info@latinchinese.com',
    'days': '天'
  }
};

let currentLang = 'es';

// 公司名称缩写（取每个单词首字母，保留原顺序）
function abbreviateCompany(company){
  if(!company) return '';
  // 分割单词（按空格或连字符）
  let words = company.split(/\s+|-/);
  let abbreviation = '';
  for(let w of words){
    if(w.length > 0 && /[A-Za-z]/i.test(w[0])){
      abbreviation += w[0].toUpperCase();
    }
  }
  return abbreviation || company.slice(0,4).toUpperCase();
}

function maskPhone(phone){
  if(!phone) return '';
  let cleaned = phone.replace(/\D/g,'');
  if(cleaned.length <= 6) return phone.slice(0,2) + '****' + phone.slice(-2);
  return phone.slice(0,3) + '****' + phone.slice(-3);
}
function maskEmail(email){
  if(!email) return '';
  let parts = email.split('@');
  if(parts.length < 2) return email;
  let local = parts[0];
  if(local.length <= 2) return local + '****@' + parts[1];
  return local.slice(0,2) + '****@' + parts[1];
}

function renderBoard(){
  const container = document.getElementById('board-container');
  if(!container) return;
  const requests = JSON.parse(localStorage.getItem('financing_requests')||'[]');
  const t = langData[currentLang];
  if(requests.length === 0){
    container.innerHTML = `<div class="empty">${t['empty']}</div>`;
    return;
  }
  container.innerHTML = requests.map(req => {
    const financed = (req.total * req.ratio / 100).toFixed(0);
    // 金额显示格式：$12500 (相当于 $25000 的 50%)
    const amountDisplay = `${t['amount']}: $${financed} (equivalente a $${req.total} al ${req.ratio}%)`;
    const termDisplay = `${t['term']}: ${req.term} ${t['days']}`;
    const maskedCompany = abbreviateCompany(req.company);
    const maskedWhatsapp = maskPhone(req.whatsapp);
    const maskedEmail = maskEmail(req.email);
    
    let methodDisplay = req.method;
    if(req.method === 'Carta de crédito diferida') methodDisplay = (currentLang === 'es') ? 'Carta de crédito diferida' : '远期信用证';
    else if(req.method === 'Pago directo a proveedor') methodDisplay = (currentLang === 'es') ? 'Pago directo a proveedor' : '直接支付给供应商';
    
    return `
      <div class="financing-item">
        <div class="financing-amount">${amountDisplay}</div>
        <div class="financing-term">${termDisplay}</div>
        
        <div class="detail-row">
          <div class="detail-icon">🏢</div>
          <div class="detail-label">${t['company']}:</div>
          <div class="detail-value">${maskedCompany}</div>
        </div>
        
        <div class="detail-row">
          <div class="detail-icon">🎯</div>
          <div class="detail-label">${t['purpose_title']}:</div>
          <div class="detail-value">
            <div class="purpose-line">${t['purpose_prefix']}</div>
            <div class="purpose-text">${req.product}</div>
          </div>
        </div>
        
        <div class="detail-row">
          <div class="detail-icon">💳</div>
          <div class="detail-label">${t['method']}:</div>
          <div class="detail-value">${methodDisplay}</div>
        </div>
        
        <div class="detail-row">
          <div class="detail-icon">📞</div>
          <div class="detail-label">${t['contact']}:</div>
          <div class="detail-value"><span class="phone-highlight">${maskedWhatsapp}</span> | ${maskedEmail}</div>
        </div>
        
        <div class="contact-note">
          ${t['contact_note']} <a href="mailto:${t['email']}">${t['email']}</a>
        </div>
      </div>
    `;
  }).join('');
}

function applyLang(){
  const t = langData[currentLang];
  for(let [id, val] of Object.entries(t)){
    let el = document.getElementById(id);
    if(el) el.innerText = val;
  }
  renderBoard();
  document.getElementById('lo-es').classList.toggle('on', currentLang === 'es');
  document.getElementById('lo-zh').classList.toggle('on', currentLang === 'zh');
}
function toggleLang(){
  currentLang = currentLang === 'es' ? 'zh' : 'es';
  applyLang();
}
window.addEventListener('load', ()=>{
  applyLang();
});
</script>
</body>
</html>
