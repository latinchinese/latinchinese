<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Catálogo Industrial · 透明化物流平台</title>
    <link rel="stylesheet" href="productos.css">
</head>
<body>
    <div class="topbar">
        <div class="logo" onclick="window.location.href='index.html'">
            <span class="logo-mini">🌐</span>
            <span class="logo-cn">透明化物流平台</span>
            <span class="logo-es">Catálogo Industrial</span>
        </div>
        <div class="lang-toggle" onclick="toggleLang()">
            <div class="lang-opt on" id="lo-es">ES</div>
            <div class="lang-opt" id="lo-zh">中文</div>
        </div>
    </div>

    <!-- 新增返回首页按钮 -->
    <div class="back-home-btn" onclick="window.location.href='index.html'">
        <span id="back-home-text">← Volver al Inicio</span>
    </div>

    <div class="search-filter">
        <input type="text" id="searchInput" placeholder="🔍  Buscar producto / 搜索产品" class="search-box">
        <!-- 分类按钮：使用自定义属性 data-cat-es 和 data-cat-zh，js动态渲染 -->
        <div class="category-grid" id="categoryGrid">
            <!-- 按钮将由 js 动态生成，以支持语言切换 -->
        </div>
    </div>

    <div class="product-grid" id="productGrid">
        <div class="loading">Cargando productos...</div>
    </div>

    <div class="footer-note">
        <span id="footer-text">¿Eres fabricante? <a href="upload_guide.html" id="upload-link">Sube tus productos aquí</a></span>
    </div>

    <!-- 询价模态框（完善取消按钮样式） -->
    <div id="inquiryModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3 id="modal-title">Solicitar cotización</h3>
            <form id="inquiryForm">
                <input type="hidden" id="productName" name="productName">
                <div class="form-group">
                    <label for="userName">Nombre / 姓名</label>
                    <input type="text" id="userName" required placeholder="Ej: Carlos Gomez">
                </div>
                <div class="form-group">
                    <label for="userEmail">Correo electrónico / 电子邮箱</label>
                    <input type="email" id="userEmail" required placeholder="cliente@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="userWhatsapp">WhatsApp / 手机号</label>
                    <input type="tel" id="userWhatsapp" required placeholder="+51 999 123 456">
                </div>
                <div class="form-group">
                    <label for="userMsg">Mensaje / 留言</label>
                    <textarea id="userMsg" rows="3" placeholder="Cantidad, puerto destino, etc."></textarea>
                </div>
                <button type="submit" class="btn-submit">📧 Enviar consulta / 发送询价</button>
                <button type="button" class="btn-cancel" onclick="closeModal()">✖️ Cancelar / 取消</button>
            </form>
            <p class="note">Al enviar se abrirá tu correo electrónico. Solo debes hacer clic en enviar.</p>
        </div>
    </div>

    <script src="productos.js"></script>
</body>
</html>
