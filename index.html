<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>透明化物流平台 · 智运链</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#07111F;color:#E2EDF8;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;max-width:430px;margin:0 auto;overflow:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 90% 45% at 50% -5%,rgba(0,194,168,0.07)0%,transparent 65%),radial-gradient(ellipse 55% 40% at 95% 85%,rgba(139,111,232,0.05)0%,transparent 55%)}
:root{--bg:#07111F;--surf:#0D1E33;--surf2:#122844;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.11);--teal:#00C2A8;--teal-d:rgba(0,194,168,0.13);--gold:#F5A623;--gold-d:rgba(245,166,35,0.13);--red:#FF4D6A;--red-d:rgba(255,77,106,0.13);--green:#22C97A;--green-d:rgba(34,201,122,0.11);--purple:#8B6FE8;--muted:#4E6A88;--text:#E2EDF8;--text2:#7A9AB8;--nav:72px;--top:58px}
.topbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:var(--top);display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(7,17,31,0.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:200}
.logo{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}.logo-mini{font-size:20px}.logo-cn{font-weight:800;font-size:15px;letter-spacing:.5px}.logo-es{font-weight:600;font-size:9px;color:var(--teal)}
.lang-toggle{display:flex;background:var(--surf2);border:1px solid var(--border2);border-radius:20px;padding:3px;cursor:pointer}
.lang-opt{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;transition:all 0.2s;background:rgba(245,166,35,0.2);color:var(--gold)}
.lang-opt.on{background:var(--teal);color:#07111F}
.notif-btn{width:34px;height:34px;border-radius:50%;background:var(--surf2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;position:relative}.notif-dot{position:absolute;top:7px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--gold);border:2px solid var(--bg)}
.scroll{position:fixed;top:var(--top);left:50%;transform:translateX(-50%);width:100%;max-width:430px;bottom:var(--nav);overflow-y:auto;overflow-x:hidden;z-index:1}
.scroll::-webkit-scrollbar{display:none}
.page{display:block;padding:22px 18px 20px;min-height:100%}
.pg-title{font-weight:800;font-size:26px;letter-spacing:-0.5px;margin-bottom:4px;background:linear-gradient(135deg,#E2EDF8 0%,#00C2A8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.pg-sub{font-weight:600;font-size:14px;color:var(--text2);margin-bottom:20px;letter-spacing:-0.2px}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:var(--nav);background:rgba(7,17,31,0.97);backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom,0)}.bni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:6px 4px;background:transparent;border:none}.bni-icon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px}.bni-label{font-size:10px;font-weight:600;color:var(--muted)}.bni.on .bni-icon{background:var(--teal-d)}.bni.on .bni-label{color:var(--teal)}
.card{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:12px;cursor:pointer}
.card:hover{border-color:rgba(0,194,168,0.3)}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"><span class="logo-mini">🌐</span><span class="logo-cn">透明化物流平台</span><span class="logo-es">Plataforma Logística Transparente</span></div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="lang-toggle" onclick="toggleLang()"><div class="lang-opt on" id="lo-es">ES</div><div class="lang-opt" id="lo-zh">中文</div></div>
    <div class="notif-btn">🔔<div class="notif-dot"></div></div>
  </div>
</div>
<div class="scroll">
  <div class="page">
    <div class="pg-title" id="t-home-title">Inicio</div>
    <div class="pg-sub" id="t-home-sub">Bienvenido, Rodrigo Silva</div>

    <!-- 板块1：物流费用对比 -->
    <div class="card" style="background:var(--teal-d); border-color:var(--teal);" onclick="window.location.href='costos/c_operativo.html'">
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="font-size:28px;">📊</div>
        <div><div style="font-weight:800; font-size:16px;" id="t-cost-title">物流费用对比</div><div style="font-size:12px; color:var(--text2);" id="t-cost-desc">Compare tarifas marítimas y bloquea precios</div></div>
      </div>
    </div>

    <!-- 板块2：买方融资需求 -->
    <div class="card" style="background:var(--gold-d); border-color:var(--gold);" onclick="window.location.href='financiamiento/r_financiero.html'">
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="font-size:28px;">💸</div>
        <div><div style="font-weight:800; font-size:16px;" id="t-fin-title">买方融资需求</div><div style="font-size:12px; color:var(--text2);" id="t-fin-desc">Publica o busca financiamiento para tus compras</div></div>
      </div>
    </div>

    <!-- 板块3：工业产品目录 -->
    <div class="card" style="background:rgba(255,77,106,0.13); border-color:var(--red);" onclick="window.location.href='catalogo/productos.html'">
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="font-size:28px;">🛒</div>
        <div><div style="font-weight:800; font-size:16px;" id="t-catalog-title">工业产品目录</div><div style="font-size:12px; color:var(--text2);" id="t-catalog-desc">Máquinas, repuestos, equipos – Precios FOB</div></div>
      </div>
    </div>

    <!-- 板块4：拉美工业化协作 -->
    <div class="card" style="background:rgba(139,111,232,0.13); border-color:var(--purple);" onclick="window.location.href='ensamblaje/ensamblaje.html'">
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="font-size:28px;">🏭</div>
        <div><div style="font-weight:800; font-size:16px;" id="t-ensamblaje-title">拉美工业化协作</div><div style="font-size:12px; color:var(--text2);" id="t-ensamblaje-desc">SKD组装 · 散件供应 · 技术指导 · 本地化生产</div></div>
      </div>
    </div>
  </div>
</div>

<!-- 底部导航（共四个：首页、入口、询价、核实） -->
<div class="bnav">
  <button class="bni on" onclick="goHome()"><div class="bni-icon">🏠</div><div class="bni-label" id="t-nav-home">Inicio</div></button>
  <button class="bni" onclick="window.location.href='login.html'"><div class="bni-icon">🔐</div><div class="bni-label" id="t-nav-login">Entrada</div></button>
  <button class="bni" onclick="window.location.href='orders.html'"><div class="bni-icon">📋</div><div class="bni-label" id="t-nav-orders">询价</div></button>
  <button class="bni" onclick="window.location.href='inspeccion.html'"><div class="bni-icon">🔍</div><div class="bni-label" id="t-nav-verify">Verificar</div></button>
</div>

<script>
  // 多语言数据（首页卡片）
  const T = {
    es: {
      't-home-title':'Inicio','t-home-sub':'Bienvenido, Rodrigo Silva',
      't-cost-title':'Comparador de Costos','t-cost-desc':'Compare tarifas marítimas y bloquea precios',
      't-fin-title':'Financiamiento para compradores','t-fin-desc':'Publica o busca financiamiento para tus compras',
      't-catalog-title':'Catálogo Industrial','t-catalog-desc':'Máquinas, repuestos, equipos – Precios FOB',
      't-ensamblaje-title':'Industrialización Colaborativa','t-ensamblaje-desc':'SKD · Suministro de piezas · Asistencia técnica',
      't-nav-home':'Inicio','t-nav-login':'Entrada','t-nav-orders':'Cotizar','t-nav-verify':'Verificar'
    },
    zh: {
      't-home-title':'首页','t-home-sub':'欢迎回来，Rodrigo Silva',
      't-cost-title':'物流费用对比','t-cost-desc':'比较海运费并锁定价格',
      't-fin-title':'买方融资需求','t-fin-desc':'发布或寻找采购融资',
      't-catalog-title':'工业产品目录','t-catalog-desc':'机械设备、配件、整机 – FOB价格',
      't-ensamblaje-title':'拉美工业化协作','t-ensamblaje-desc':'SKD散件供应 · 组装技术转移 · 本地化生产',
      't-nav-home':'首页','t-nav-login':'入口','t-nav-orders':'询价','t-nav-verify':'核实'
    }
  };
  let lang = 'es';
  function applyLang() {
    const t = T[lang];
    for (let [id, val] of Object.entries(t)) {
      let el = document.getElementById(id);
      if (el) el.innerHTML = val;
    }
  }
  function toggleLang() {
    lang = lang === 'es' ? 'zh' : 'es';
    applyLang();
    // 更新语言切换按钮样式
    document.getElementById('lo-es').classList.toggle('on', lang === 'es');
    document.getElementById('lo-zh').classList.toggle('on', lang === 'zh');
  }
  function goHome() { /* 已经首页，无需跳转 */ }
  window.addEventListener('load', applyLang);
</script>
</body>
</html>
