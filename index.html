<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plataforma logística transparente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --logi-blue: #0047BB; }
        .bg-logi-blue { background-color: var(--logi-blue); }
        .text-logi-blue { color: var(--logi-blue); }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 封面样式 */
        #splash-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: linear-gradient(135deg, #0047BB 0%, #002e7a 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease;
        }
        
        .page { display: none; }
        .page.active { display: block; }
        .nav-item.active { color: var(--logi-blue); font-weight: 800; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <div id="splash-screen">
        <div class="text-white text-center fade-in">
            <div class="text-6xl mb-6">🚢</div>
            <h1 class="text-2xl font-black tracking-tighter">Plataforma logística transparente</h1>
            <p class="mt-2 text-sm opacity-60 font-light">Transparencia Total • Eficiencia Global</p>
            <div class="mt-10 flex space-x-2 justify-center">
                <div class="w-2 h-2 bg-white rounded-full animate-bounce"></div>
                <div class="w-2 h-2 bg-white rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                <div class="w-2 h-2 bg-white rounded-full animate-bounce [animation-delay:-0.3s]"></div>
            </div>
        </div>
    </div>

    <div id="main-app" class="max-w-md mx-auto min-h-screen flex flex-col bg-white shadow-2xl relative">
        
        <header class="bg-logi-blue text-white p-5 flex justify-between items-center sticky top-0 z-[100]">
            <div>
                <h1 class="text-sm font-bold leading-tight">Plataforma logística transparente</h1>
                <p class="text-[9px] opacity-70 uppercase font-black">透明化物流平台</p>
            </div>
            <button onclick="toggleLang()" class="bg-white/10 border border-white/20 px-3 py-1 rounded-full text-[10px] font-black">ES/ZH</button>
        </header>

        <main class="flex-grow p-4 pb-32">
            
            <div id="page-home" class="page active fade-in space-y-6">
                <h2 class="text-2xl font-black text-gray-800" data-zh="您好，进口商" data-es="Hola, Importador">您好，进口商</h2>
                
                <section class="bg-gradient-to-br from-blue-600 to-blue-800 p-6 rounded-[32px] text-white shadow-xl relative overflow-hidden">
                    <div class="relative z-10">
                        <h3 class="font-black text-xl mb-1" data-zh="发布求购信息" data-es="Publicar Requerimiento">发布求购信息</h3>
                        <p class="text-[10px] opacity-80 mb-5" data-zh="快速获取货代精准报价" data-es="Obtenga cotizaciones rápidamente">快速获取货代精准报价</p>
                        <button class="bg-white text-blue-700 text-[11px] px-6 py-3 rounded-2xl font-black uppercase tracking-widest">立即发布 / POST</button>
                    </div>
                    <span class="absolute -right-6 -bottom-6 text-9xl opacity-10">📢</span>
                </section>

                <div class="grid grid-cols-3 gap-4">
                    <div class="bg-slate-50 p-4 rounded-[28px] flex flex-col items-center border border-slate-100">
                        <span class="text-2xl mb-1">🚚</span>
                        <span class="text-[9px] font-black text-gray-500 uppercase" data-zh="查询" data-es="Consultar">查询</span>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-[28px] flex flex-col items-center border border-slate-100">
                        <span class="text-2xl mb-1">🛡️</span>
                        <span class="text-[9px] font-black text-gray-500 uppercase" data-zh="保障" data-es="Garantía">保障</span>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-[28px] flex flex-col items-center border border-slate-100">
                        <span class="text-2xl mb-1">🤖</span>
                        <span class="text-[9px] font-black text-gray-500 uppercase" data-zh="智控" data-es="Logi AI">智控</span>
                    </div>
                </div>
            </div>

            <div id="page-rates" class="page fade-in space-y-6">
                <h2 class="text-2xl font-black text-gray-800" data-zh="资费报价比对" data-es="Tarifas - Oferta">资费报价比对</h2>
                <div class="bg-white border-2 border-slate-50 rounded-[32px] p-6 shadow-sm space-y-4">
                    <div id="fee-inputs-container" class="space-y-4">
                        </div>
                    <button class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg mt-4">启动审计 / AUDITAR</button>
                </div>
            </div>

            <div id="page-me" class="page fade-in space-y-6">
                <h2 class="text-2xl font-black text-gray-800" data-zh="账户中心" data-es="Centro de Usuario">账户中心</h2>
                
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white border p-4 rounded-2xl flex flex-col items-center shadow-sm">
                        <span class="text-xl mb-2">🛍️</span>
                        <p class="text-[10px] font-black" data-zh="买方登录" data-es="Login Comprador">买方登录</p>
                        <button class="mt-2 text-[9px] text-blue-600 font-bold">Registro</button>
                    </div>
                    <div class="bg-white border p-4 rounded-2xl flex flex-col items-center shadow-sm">
                        <span class="text-xl mb-2">🏭</span>
                        <p class="text-[10px] font-black" data-zh="卖方登录" data-es="Login Vendedor">卖方登录</p>
                        <button class="mt-2 text-[9px] text-blue-600 font-bold">Registro</button>
                    </div>
                    <div class="bg-white border p-4 rounded-2xl flex flex-col items-center shadow-sm">
                        <span class="text-xl mb-2">🚢</span>
                        <p class="text-[10px] font-black" data-zh="货代登录" data-es="Login Forwarder">货代登录</p>
                        <button class="mt-2 text-[9px] text-blue-600 font-bold">Registro</button>
                    </div>
                    <div class="bg-white border p-4 rounded-2xl flex flex-col items-center shadow-sm">
                        <span class="text-xl mb-2">🛠️</span>
                        <p class="text-[10px] font-black" data-zh="管理员登录" data-es="Login Admin">管理员登录</p>
                        <button class="mt-2 text-[9px] text-blue-600 font-bold">Acceso</button>
                    </div>
                </div>

                <div class="space-y-2 mt-4">
                    <div class="p-4 bg-slate-50 rounded-xl flex justify-between items-center text-sm font-bold text-gray-700">
                        <span data-zh="公司资料" data-es="Perfil de Empresa">公司资料</span><span>→</span>
                    </div>
                    <div class="p-4 bg-slate-50 rounded-xl flex justify-between items-center text-sm font-bold text-gray-700">
                        <span data-zh="合同管理" data-es="Contratos">合同管理</span><span>→</span>
                    </div>
                </div>
            </div>

        </main>

        <nav class="bg-white border-t border-gray-100 flex justify-around p-4 fixed bottom-0 w-full max-w-md z-[100]">
            <button onclick="goPage('home')" id="btn-home" class="nav-item active flex flex-col items-center">
                <span class="text-xl">🏠</span><span class="text-[9px] mt-1">Inicio</span>
            </button>
            <button onclick="goPage('orders')" id="btn-orders" class="nav-item flex flex-col items-center text-gray-400">
                <span class="text-xl">📋</span><span class="text-[9px] mt-1">Pedidos</span>
            </button>
            <button onclick="goPage('rates')" id="btn-rates" class="nav-item flex flex-col items-center text-gray-400">
                <span class="text-xl">💰</span><span class="text-[9px] mt-1">Tarifas</span>
            </button>
            <button onclick="goPage('me')" id="btn-me" class="nav-item flex flex-col items-center text-gray-400">
                <span class="text-xl">👤</span><span class="text-[9px] mt-1">Yo</span>
            </button>
        </nav>
    </div>

    <script>
        // 1. 封面逻辑
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            splash.style.opacity = '0';
            setTimeout(() => splash.style.display = 'none', 800);
        }, 3000);

        // 2. 页面导航逻辑
        function goPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => {
                n.classList.remove('active', 'text-logi-blue');
                n.classList.add('text-gray-400');
            });
            
            document.getElementById('page-' + pageId).classList.add('active');
            const btn = document.getElementById('btn-' + pageId);
            btn.classList.add('active', 'text-logi-blue');
            btn.classList.remove('text-gray-400');
        }

        // 3. 动态生成费用项
        const fees = [
            {id:'vb', zh:'核放费 / V.B.', es:'Visto Bueno'},
            {id:'descon', zh:'拆箱费 / Descon.', es:'Desconsolidación'},
            {id:'tdi', zh:'数据费 / TDI', es:'TDI'},
            {id:'mach', zh:'吊箱费 / MACH', es:'MACH'},
            {id:'thc', zh:'码头费 / THC', es:'THC'},
            {id:'agencia', zh:'代理费 / Agencia', es:'S. Agencia'},
            {id:'trans', zh:'运输费 / Transporte', es:'Transporte'},
            {id:'storage', zh:'临时仓库费 / Almacén Temp.', es:'Almacén Temporal'}
        ];

        const feeContainer = document.getElementById('fee-inputs-container');
        fees.forEach(f => {
            feeContainer.innerHTML += `
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-gray-500 uppercase">${f.zh}</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 font-bold">$</span>
                        <input type="number" placeholder="0.00" class="w-full pl-8 p-3 bg-gray-50 rounded-2xl border-2 border-transparent focus:border-blue-500 outline-none font-mono text-sm font-bold">
                    </div>
                </div>
            `;
        });

        // 4. 语言切换逻辑
        let currentLang = 'zh';
        function toggleLang() {
            currentLang = currentLang === 'zh' ? 'es' : 'zh';
            document.querySelectorAll('[data-zh]').forEach(el => {
                el.innerText = el.getAttribute('data-' + currentLang);
            });
        }
    </script>
</body>
</html>
