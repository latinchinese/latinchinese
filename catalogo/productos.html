<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Catálogo Industrial · 透明化物流平台</title>
    <style>
        /* 样式与原版一致，略（为了节省篇幅，请使用之前已稳定的样式） */
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#07111F;color:#E2EDF8;font-family:system-ui,sans-serif;max-width:430px;margin:0 auto;padding-bottom:30px}
        .topbar{position:sticky;top:0;background:rgba(7,17,31,0.95);backdrop-filter:blur(20px);display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,0.1)}
        .logo{display:flex;align-items:baseline;gap:6px;cursor:pointer}
        .logo-mini{font-size:20px}.logo-cn{font-weight:800;font-size:15px}.logo-es{font-weight:600;font-size:9px;color:#00C2A8}
        .lang-toggle{display:flex;background:#122844;border-radius:20px;padding:3px;cursor:pointer}
        .lang-opt{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;background:rgba(245,166,35,0.2);color:#F5A623;white-space:nowrap}
        .lang-opt.on{background:#00C2A8;color:#07111F}
        .back-home{display:inline-block;margin:16px 0 8px 18px;padding:8px 16px;background:#122844;border-radius:30px;font-size:13px;color:#00C2A8;cursor:pointer;border:1px solid rgba(255,255,255,0.1);width:auto}
        .search-filter{padding:8px 18px;background:#0D1E33;border-bottom:1px solid rgba(255,255,255,0.05)}
        .search-box{width:100%;padding:12px 16px;background:#122844;border:1px solid rgba(255,255,255,0.1);border-radius:30px;color:white;font-size:14px;outline:none;margin-bottom:12px}
        .search-box:focus{border-color:#00C2A8}
        .category-grid{display:flex;flex-wrap:wrap;gap:8px}
        .cat-btn{background:#122844;border:1px solid rgba(255,255,255,0.1);border-radius:30px;padding:6px 14px;font-size:12px;font-weight:600;color:#7A9AB8;cursor:pointer}
        .cat-btn.active{background:#00C2A8;color:#07111F;border-color:#00C2A8}
        .product-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px 18px}
        .product-card{background:#0D1E33;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,0.07)}
        .product-card:hover{border-color:rgba(0,194,168,0.4)}
        .product-img{width:100%;aspect-ratio:1/1;background:#122844;display:flex;align-items:center;justify-content:center;font-size:48px;color:#00C2A8}
        .product-img img{width:100%;height:100%;object-fit:cover}
        .product-info{padding:12px}
        .product-name{font-weight:700;font-size:14px;margin-bottom:4px;line-height:1.3}
        .product-price{color:#F5A623;font-family:monospace;font-weight:700;font-size:16px;margin:6px 0}
        .product-origin{font-size:11px;color:#7A9AB8;margin-bottom:8px}
        .btn-inquiry{background:transparent;border:1px solid #00C2A8;border-radius:30px;padding:6px 0;width:100%;color:#00C2A8;font-size:12px;font-weight:600;cursor:pointer}
        .btn-inquiry:hover{background:#00C2A8;color:#07111F}
        .btn-detail{background:transparent;border:1px solid #8B6FE8;border-radius:30px;padding:6px 0;width:100%;color:#8B6FE8;font-size:12px;font-weight:600;cursor:pointer;margin-top:6px}
        .btn-detail:hover{background:#8B6FE8;color:#07111F}
        .modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background-color:rgba(0,0,0,0.8);align-items:center;justify-content:center}
        .modal-content{background:#0D1E33;max-width:340px;width:90%;border-radius:28px;padding:24px;border:1px solid rgba(0,194,168,0.3);position:relative}
        .close{position:absolute;right:18px;top:12px;font-size:24px;cursor:pointer;color:#7A9AB8}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;font-size:12px;font-weight:600;color:#7A9AB8;margin-bottom:5px}
        .form-group input,.form-group textarea{width:100%;background:#122844;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px 12px;color:white}
        .btn-submit{background:#00C2A8;border:none;border-radius:30px;padding:12px;width:100%;font-weight:700;color:#07111F;cursor:pointer;margin-top:8px}
        .btn-cancel{background:transparent;border:1px solid rgba(255,255,255,0.2);border-radius:30px;padding:10px;width:100%;color:#7A9AB8;margin-top:8px;cursor:pointer}
        .btn-cancel:hover{border-color:#F5A623;color:#F5A623}
        .note{font-size:10px;color:#7A9AB8;text-align:center;margin-top:12px}
        .footer-note{text-align:center;padding:20px 18px 30px;color:#7A9AB8;font-size:12px;border-top:1px solid rgba(255,255,255,0.05)}
        .footer-note a{color:#00C2A8;text-decoration:none}
        .similar-section{margin-top:20px;border-top:1px solid rgba(255,255,255,0.1);padding-top:16px}
        .similar-title{font-size:12px;font-weight:700;color:#00C2A8;margin-bottom:12px}
        .similar-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
        .similar-card{background:#122844;border-radius:12px;padding:8px;min-width:100px;cursor:pointer;border:1px solid rgba(255,255,255,0.07)}
        .similar-card:hover{border-color:#00C2A8}
        .similar-img{font-size:32px;text-align:center}
        .similar-name{font-size:11px;font-weight:600;margin-top:4px}
        .similar-price{font-size:10px;color:#F5A623;margin-top:2px}
    </style>
</head>
<body>
    <div class="topbar">
        <div class="logo" onclick="window.location.href='../index.html'">
            <span class="logo-mini">🌐</span><span class="logo-cn">透明化物流平台</span>
            <span class="logo-es">Catálogo Industrial</span>
        </div>
        <div class="lang-toggle" onclick="toggleLang()">
            <div class="lang-opt on" id="lo-es">ES</div><div class="lang-opt" id="lo-zh">中文</div>
        </div>
    </div>
    <div class="back-home" onclick="window.location.href='../index.html'">
        <span id="back-home-text">← Volver al Inicio</span>
    </div>

    <div class="search-filter">
        <input type="text" id="searchInput" placeholder="🔍 Buscar producto / 搜索产品" class="search-box">
        <div class="category-grid" id="categoryGrid"></div>
    </div>
    <div class="product-grid" id="productGrid"></div>
    <div class="footer-note">
        <span id="footer-text">¿Eres fabricante? <a href="../upload_guide.html">Sube tus productos aquí</a></span>
    </div>

    <!-- 询价模态框 -->
    <div id="inquiryModal" class="modal" onclick="if(event.target===this) closeModal()">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3 id="modal-title">Solicitar cotización</h3>
            <form id="inquiryForm">
                <input type="hidden" id="productName">
                <div class="form-group"><label for="userName">Nombre / 姓名</label><input type="text" id="userName" required placeholder="Ej: Carlos Gomez"></div>
                <div class="form-group"><label for="userEmail">Correo electrónico / 电子邮箱</label><input type="email" id="userEmail" required placeholder="cliente@ejemplo.com"></div>
                <div class="form-group"><label for="userWhatsapp">WhatsApp / 手机号</label><input type="tel" id="userWhatsapp" required placeholder="+51 999 123 456"></div>
                <div class="form-group"><label for="userMsg">Mensaje / 留言</label><textarea id="userMsg" rows="3" placeholder="Cantidad, puerto destino, etc."></textarea></div>
                <button type="submit" class="btn-submit">📧 Enviar consulta / 发送询价</button>
                <button type="button" class="btn-cancel" onclick="closeModal()">✖️ Cancelar / 取消</button>
            </form>
            <p class="note">Al enviar se abrirá tu correo electrónico. Solo debes hacer clic en enviar.</p>
        </div>
    </div>

    <script>
        // ==================== 产品数据 ====================
        const allProducts = [
            { id: 1, name_es: "Motor Diesel 22HP", name_zh: "22马力柴油发动机", category: "motor", price: 420, origin: "Chongqing, China", image: "" },
            { id: 2, name_es: "Planta de tratamiento de aguas (5m³/h)", name_zh: "小型污水处理设备 5吨/小时", category: "agua", price: 6200, origin: "Shanghai, China", image: "" },
            { id: 3, name_es: "Panel solar 550W", name_zh: "550W 太阳能板", category: "energia", price: 135, origin: "Jiangsu, China", image: "" },
            { id: 4, name_es: "Tractor pequeño SKD", name_zh: "小型拖拉机散件 (SKD)", category: "agricultura", price: 3800, origin: "Shandong, China", image: "" },
            { id: 5, name_es: "Bomba de agua sumergible 2HP", name_zh: "2匹潜水泵", category: "agricultura", price: 98, origin: "Zhejiang, China", image: "" },
            { id: 6, name_es: "Inversor solar 3kW", name_zh: "3千瓦太阳能逆变器", category: "energia", price: 290, origin: "Guangdong, China", image: "" },
            { id: 7, name_es: "Desbrozadora 52cc", name_zh: "割草机 (52cc)", category: "herramientas", price: 85, origin: "Zhejiang, China", image: "" },
            { id: 8, name_es: "Cinta transportadora 4m", name_zh: "4米输送带", category: "industrial", price: 720, origin: "Shanghai, China", image: "" },
            { id: 9, name_es: "Separador de sólidos para aguas", name_zh: "污水处理固液分离机", category: "agua", price: 2350, origin: "Jiangsu, China", image: "" },
            // 新产品 EVA 地垫，归类为 "hogar"，图片占位
            { id: 10, name_es: "EVA Interlocking Floor Mat", name_zh: "EVA互锁地板垫", category: "hogar", price: 0.60, origin: "Shandong / Zhejiang, China", image: "img/eva-placeholder.jpg" }
        ];

        // 分类列表（增加 "hogar"）
        const categories = [
            { cat: "all", es: "Todos", zh: "全部" },
            { cat: "agricultura", es: "🚜 Agricultura", zh: "🚜 农业" },
            { cat: "agua", es: "💧 Tratamiento agua", zh: "💧 水处理" },
            { cat: "motor", es: "⚙️ Motores", zh: "⚙️ 发动机" },
            { cat: "energia", es: "☀️ Energía solar", zh: "☀️ 太阳能" },
            { cat: "herramientas", es: "🔧 Herramientas", zh: "🔧 工具" },
            { cat: "industrial", es: "🏭 Equipos industriales", zh: "🏭 工业设备" },
            { cat: "hogar", es: "🏠 Hogar", zh: "🏠 家居用品" }
        ];

        let currentLang = 'es';
        let currentCategory = 'all';

        function renderCategoryButtons() {
            const container = document.getElementById('categoryGrid');
            container.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn';
                if (cat.cat === currentCategory) btn.classList.add('active');
                btn.setAttribute('data-cat', cat.cat);
                btn.textContent = currentLang === 'es' ? cat.es : cat.zh;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = cat.cat;
                    filterProducts();
                });
                container.appendChild(btn);
            });
        }

        function filterProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            let filtered = allProducts.filter(p => currentCategory === 'all' || p.category === currentCategory);
            if (searchTerm) {
                filtered = filtered.filter(p => p.name_es.toLowerCase().includes(searchTerm) || p.name_zh.includes(searchTerm));
            }
            renderProducts(filtered);
        }

        function renderProducts(products) {
            const grid = document.getElementById('productGrid');
            if (!grid) return;
            if (products.length === 0) {
                grid.innerHTML = '<div class="loading">No se encontraron productos / 没有找到产品</div>';
                return;
            }
            grid.innerHTML = products.map(p => {
                // 判断是否是新产品（id=10），增加“查看详情”按钮
                const isNewEVA = (p.id === 10);
                const buttons = `
                    <button class="btn-inquiry" data-id="${p.id}">📩 ${currentLang === 'es' ? 'Consultar' : '询价'}</button>
                    ${isNewEVA ? `<button class="btn-detail" onclick="window.location.href='producto_eva.html'">🔍 ${currentLang === 'es' ? 'Ver detalles' : '查看详情'}</button>` : ''}
                `;
                return `
                    <div class="product-card" data-id="${p.id}">
                        <div class="product-img">${p.image ? `<img src="${p.image}" alt="${p.name_es}">` : '📦'}</div>
                        <div class="product-info">
                            <div class="product-name">${currentLang === 'es' ? p.name_es : p.name_zh}</div>
                            <div class="product-price">$${p.price} USD</div>
                            <div class="product-origin">📍 ${p.origin}</div>
                            ${buttons}
                        </div>
                    </div>
                `;
            }).join('');
            // 绑定询价按钮事件
            document.querySelectorAll('.btn-inquiry').forEach(btn => {
                btn.removeEventListener('click', inquiryHandler);
                btn.addEventListener('click', inquiryHandler);
            });
        }

        function inquiryHandler(e) {
            const id = parseInt(e.currentTarget.dataset.id);
            const product = allProducts.find(p => p.id === id);
            if (product) openInquiryModal(product);
        }

        function openInquiryModal(product) {
            document.getElementById('productName').value = currentLang === 'es' ? product.name_es : product.name_zh;
            document.getElementById('inquiryModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('inquiryModal').style.display = 'none';
            document.getElementById('inquiryForm').reset();
        }

        document.getElementById('inquiryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('userName').value.trim();
            const email = document.getElementById('userEmail').value.trim();
            const whatsapp = document.getElementById('userWhatsapp').value.trim();
            const msg = document.getElementById('userMsg').value.trim();
            const productName = document.getElementById('productName').value;
            if (!name || !email || !whatsapp) {
                alert(currentLang === 'es' ? 'Complete nombre, email y WhatsApp' : '请填写姓名、邮箱和WhatsApp');
                return;
            }
            const subject = `Consulta sobre ${productName}`;
            const body = `Nombre: ${name}%0AEmail: ${email}%0AWhatsApp: ${whatsapp}%0AProducto: ${productName}%0AMensaje: ${msg}`;
            window.location.href = `mailto:latinavance.latinavance@gmail.com?subject=${subject}&body=${body}`;
            closeModal();
            alert(currentLang === 'es' ? '✅ Se abrió tu correo. Solo envía el mensaje.' : '✅ 已打开邮件客户端，请发送即可。');
        });

        function toggleLang() {
            currentLang = currentLang === 'es' ? 'zh' : 'es';
            document.getElementById('lo-es').classList.toggle('on', currentLang === 'es');
            document.getElementById('lo-zh').classList.toggle('on', currentLang === 'zh');
            applyLang();
        }

        function applyLang() {
            // 更新静态文本
            const backBtn = document.getElementById('back-home-text');
            if (backBtn) backBtn.innerText = currentLang === 'es' ? '← Volver al Inicio' : '← 返回首页';
            const modalTitle = document.getElementById('modal-title');
            if (modalTitle) modalTitle.innerText = currentLang === 'es' ? 'Solicitar cotización' : '询价';
            const footerSpan = document.getElementById('footer-text');
            if (footerSpan) {
                footerSpan.innerHTML = currentLang === 'es' 
                    ? '¿Eres fabricante? <a href="../upload_guide.html">Sube tus productos aquí</a>'
                    : '您是工厂吗？<a href="../upload_guide.html">免费上传您的产品</a>';
            }
            renderCategoryButtons();
            filterProducts();
        }

        document.getElementById('searchInput').addEventListener('input', filterProducts);

        window.addEventListener('load', () => {
            renderCategoryButtons();
            applyLang();
        });
    </script>
</body>
</html>
